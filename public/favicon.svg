<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="gold-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#d4af37" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="32" fill="#08090c"/>
  <circle cx="64" cy="64" r="54" stroke="#ffd700" stroke-width="2" fill="none" opacity="0.3"/>
  <text x="64" y="86" font-family="'Cormorant Garamond', Georgia, serif" font-size="78" font-weight="700" fill="url(#gold-radial)" text-anchor="middle" filter="url(#glow)">π</text>
</svg>
